name: Tip or bounty boost
about: Add sats/support signal to an existing solution or bounty
labels: [tip, bounty-boost]
body:
  - type: input
    id: target
    attributes:
      label: Target card/bounty URL or path
    validations:
      required: true
  - type: input
    id: amount
    attributes:
      label: Amount in sats
      placeholder: 1000 pledged or tipped
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - pledge-on-acceptance
        - tip-after-use
        - funded-escrow
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Sanitized note
      description: No private context.
